plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gluonhq.gluonfx-gradle-plugin' version '1.0.29'
}

group = 'uz.jtscorp'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

application {
    mainClass = 'uz.jtscorp.filesync.Main'
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.fxml']
}

gluonfx {
    target = 'host'
    // Substrate bundles FXML, CSS, fonts and images by itself, but not the message files.
    resourcesList = ['.*[.]properties$']
    // FXMLLoader reaches each controller's @FXML fields and #handler methods by
    // reflection, and constructs the step views itself; native-image strips both otherwise.
    reflectionList = ['uz.jtscorp.filesync.ui.MainView', 'uz.jtscorp.filesync.ui.SetupView',
                      'uz.jtscorp.filesync.ui.CheckView', 'uz.jtscorp.filesync.ui.ReviewView',
                      'uz.jtscorp.filesync.ui.ApplyView', 'uz.jtscorp.filesync.ui.ToolsView']
    // The JavaFX side is NOT covered by Substrate's built-in config: it omits every on*
    // event handler and several controls outright, so the FXML load dies at launch (see
    // src/main/resources/META-INF/native-image/, generated by the tracing agent).
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

// An installer with its own Java runtime, for the system Gradle runs on: .deb on Linux,
// .msi on Windows, .dmg on macOS (jpackage cannot build for another system). The release
// workflow runs this once per system; -PappVersion carries the tag, -PinstallerType
// overrides the kind (app-image gives a runnable folder without packaging it).
// unison, diff and diff3 are still not bundled.
tasks.register('installer', Exec) {
    group = 'distribution'
    description = 'Builds an installer for this operating system with jpackage.'
    dependsOn jar

    def os = org.gradle.internal.os.OperatingSystem.current()
    def type = findProperty('installerType') ?: (os.windows ? 'msi' : os.macOsX ? 'dmg' : 'deb')
    // jpackage takes digits and dots only: v1.2.0 -> 1.2.0, 1.0-SNAPSHOT -> 1.0
    def appVersion = (findProperty('appVersion') ?: version).toString()
            .replaceFirst(/^v/, '').replaceFirst(/-.*$/, '')
    def input = layout.buildDirectory.dir('installer/input')
    def output = layout.buildDirectory.dir('installer/out')
    // Main extends Application, so JavaFX has to be in the runtime image as modules; on
    // the class path the launcher refuses to start it.
    def javafxJars = configurations.runtimeClasspath.filter { it.name.startsWith('javafx-') }
    def jdk = javaToolchains.launcherFor(java.toolchain)

    doFirst {
        delete input, output
        copy {
            from jar
            into input
        }
        executable = jdk.get().metadata.installationPath.file('bin/jpackage').asFile
        args '--type', type,
                '--name', 'FileSync',
                '--app-version', appVersion,
                '--input', input.get().asFile,
                '--main-jar', jar.archiveFileName.get(),
                '--main-class', application.mainClass.get(),
                '--module-path', javafxJars.asPath,
                '--add-modules', 'javafx.controls,javafx.fxml',
                '--dest', output.get().asFile
        if (type == 'deb' || type == 'rpm') {
            args '--linux-shortcut', '--linux-menu-group', 'Utility'
        }
        if (type == 'msi' || type == 'exe') {
            // The upgrade UUID must never change: it is how a newer .msi finds the old install.
            args '--win-menu', '--win-shortcut', '--win-dir-chooser',
                    '--win-upgrade-uuid', '7b0d5c1e-4a52-4f0e-9d3b-6f2f6a1c8e47'
        }
    }
}
