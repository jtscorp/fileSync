name: Release

# A tag like v1.2.0 builds an installer on each system and publishes them as a GitHub
# Release. "Run workflow" builds the same installers without publishing anything; they
# are then on the run's page as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: gradle

      # jpackage wants digits and dots; a manual run has no tag, so it is 0.0.<run number>.
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      # The tests shell out to diff and were only ever run on Linux.
      - name: Test
        if: runner.os == 'Linux'
        run: ./gradlew test

      - name: Build the installer
        shell: bash
        run: ./gradlew installer "-PappVersion=$APP_VERSION"

      # Both macOS builds come out as FileSync-<version>.dmg, so every file gets its system.
      - name: Name the installer
        shell: bash
        run: |
          cd build/installer/out
          for file in *; do
            mv "$file" "FileSync-$APP_VERSION-${{ matrix.name }}.${file##*.}"
          done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: FileSync-${{ matrix.name }}
          path: build/installer/out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo "$GITHUB_REPOSITORY"
          --title "FileSync $GITHUB_REF_NAME"
          --generate-notes
